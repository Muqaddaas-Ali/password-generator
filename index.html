<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Password Generator</h1>

    <div class="password-box">
      <input type="text" id="passwordOutput" readonly placeholder="Your password will appear here">
      <button id="copyBtn" title="Copy password">📋</button>
    </div>
    <p id="copyMsg"></p>

    <!-- Length option -->
    <div class="option">
      <label for="lengthRange">Password Length: <span id="lengthValue">12</span></label>
      <input type="range" id="lengthRange" min="4" max="32" value="12">
    </div>

    <!-- Checkbox options -->
    <div class="option checkbox-option">
      <input type="checkbox" id="uppercase" checked>
      <label for="uppercase">Include Uppercase Letters (A-Z)</label>
    </div>

    <div class="option checkbox-option">
      <input type="checkbox" id="lowercase" checked>
      <label for="lowercase">Include Lowercase Letters (a-z)</label>
    </div>

    <div class="option checkbox-option">
      <input type="checkbox" id="numbers" checked>
      <label for="numbers">Include Numbers (0-9)</label>
    </div>

    <div class="option checkbox-option">
      <input type="checkbox" id="symbols">
      <label for="symbols">Include Symbols (!@#$%)</label>
    </div>

    <button id="generateBtn">Generate Password</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
